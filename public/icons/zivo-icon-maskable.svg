<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ZIVO Royal Gold and Obsidian maskable logo">
  <defs>
    <radialGradient id="obsidian" cx="33%" cy="23%" r="87%">
      <stop stop-color="#211f1b"/>
      <stop offset=".55" stop-color="#10100f"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="152" y1="116" x2="365" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff2bc"/>
      <stop offset=".2" stop-color="#d9b45c"/>
      <stop offset=".38" stop-color="#fff0a6"/>
      <stop offset=".56" stop-color="#a97924"/>
      <stop offset=".76" stop-color="#f8df88"/>
      <stop offset="1" stop-color="#c19235"/>
    </linearGradient>
    <linearGradient id="rim" x1="70" y1="70" x2="442" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0b3"/>
      <stop offset=".4" stop-color="#a87b2d"/>
      <stop offset=".68" stop-color="#f4dc8b"/>
      <stop offset="1" stop-color="#8c6221"/>
    </linearGradient>
    <filter id="texture">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .1"/></feComponentTransfer>
    </filter>
    <filter id="gold-shadow" x="-.3" y="-.3" width="1.6" height="1.7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#d5a842" flood-opacity=".3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="badge-clip"><circle cx="256" cy="256" r="218"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="256" fill="#050505"/>
  <circle cx="256" cy="256" r="232" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="223" fill="url(#obsidian)"/>
  <g clip-path="url(#badge-clip)">
    <rect x="32" y="32" width="448" height="448" filter="url(#texture)" opacity=".2"/>
    <circle cx="256" cy="256" r="207" fill="none" stroke="#f5dfa0" stroke-opacity=".14" stroke-width="1.5"/>
    <path d="M139 150h234L191 309h182" fill="none" stroke="#5e451d" stroke-width="43" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 7)" opacity=".72"/>
    <path d="m143 175 104 190 104-190" fill="none" stroke="#57411e" stroke-width="37" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 6)" opacity=".76"/>
    <g filter="url(#gold-shadow)">
      <path d="M139 150h234L191 309h182" fill="none" stroke="url(#gold)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m143 175 104 190 104-190" fill="none" stroke="url(#gold)" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M151 149h198" fill="none" stroke="#fff9dd" stroke-opacity=".72" stroke-width="4" stroke-linecap="round"/>
      <path d="m151 180 94 170" fill="none" stroke="#fff0bc" stroke-opacity=".58" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="m239 239 50 31-50 31z" fill="#11100d" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <path d="m247 247 30 19" fill="none" stroke="#fff4c8" stroke-opacity=".72" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#fff2c0" stroke-opacity=".28" stroke-width="2"/>
</svg>
